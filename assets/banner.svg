<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="40%" stop-color="#080820"/>
      <stop offset="100%" stop-color="#0a0a30"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc6a"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#8844ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowH">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.03" stroke="white" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/><line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>
  <circle cx="640" cy="320" r="300" fill="rgba(0,212,255,0.03)" filter="url(#glowH)"/>
  <!-- City skyline silhouette -->
  <g transform="translate(0,320)" opacity="0.08" fill="rgba(0,212,255,0.3)">
    <rect x="50" y="-180" width="40" height="180" rx="2"/>
    <rect x="100" y="-240" width="30" height="240" rx="2"/>
    <rect x="140" y="-120" width="50" height="120" rx="2"/>
    <rect x="200" y="-280" width="35" height="280" rx="2"/>
    <rect x="250" y="-160" width="45" height="160" rx="2"/>
    <rect x="310" y="-300" width="25" height="300" rx="2"/>
    <rect x="350" y="-200" width="55" height="200" rx="2"/>
    <rect x="420" y="-260" width="30" height="260" rx="2"/>
    <rect x="460" y="-140" width="60" height="140" rx="2"/>
    <rect x="540" y="-320" width="28" height="320" rx="2"/>
    <rect x="580" y="-180" width="50" height="180" rx="2"/>
    <rect x="640" y="-250" width="35" height="250" rx="2"/>
    <rect x="690" y="-160" width="55" height="160" rx="2"/>
    <rect x="760" y="-290" width="30" height="290" rx="2"/>
    <rect x="800" y="-210" width="45" height="210" rx="2"/>
    <rect x="860" y="-340" width="25" height="340" rx="2"/>
    <rect x="900" y="-170" width="50" height="170" rx="2"/>
    <rect x="960" y="-240" width="35" height="240" rx="2"/>
    <rect x="1010" y="-130" width="55" height="130" rx="2"/>
    <rect x="1080" y="-270" width="30" height="270" rx="2"/>
    <rect x="1120" y="-190" width="45" height="190" rx="2"/>
    <rect x="1180" y="-310" width="28" height="310" rx="2"/>
  </g>
  <!-- Neon accent lines -->
  <line x1="60" y1="540" x2="1220" y2="540" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <line x1="60" y1="543" x2="1220" y2="543" stroke="rgba(0,255,136,0.1)" stroke-width="1"/>
  <!-- Decorative dots -->
  <circle cx="60" cy="540" r="3" fill="#00d4ff" opacity="0.4"/>
  <circle cx="1220" cy="540" r="3" fill="#00ff88" opacity="0.4"/>
  <!-- Left decorative panel -->
  <rect x="80" y="100" width="320" height="340" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <g transform="translate(240,220)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.6"/>
    <path d="M-15,-12 L-15,12 L14,0 Z" fill="url(#greenGrad)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="-28" cy="-28" r="3" fill="#00d4ff" opacity="0.5"/>
    <circle cx="30" cy="-22" r="2.5" fill="#00ff88" opacity="0.4"/>
    <circle cx="-24" cy="30" r="2.5" fill="#ff0080" opacity="0.4"/>
  </g>
  <!-- Feature badges -->
  <g transform="translate(100,340)">
    <rect x="0" y="0" width="130" height="20" rx="10" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="0.5"/>
    <text x="65" y="13" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#00d4ff" letter-spacing="2">LIFE SIMULATION</text>
    <rect x="0" y="28" width="90" height="20" rx="10" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.2)" stroke-width="0.5"/>
    <text x="45" y="41" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#00ff88" letter-spacing="2">OPEN WORLD</text>
    <rect x="0" y="56" width="110" height="20" rx="10" fill="rgba(255,0,128,0.08)" stroke="rgba(255,0,128,0.2)" stroke-width="0.5"/>
    <text x="55" y="69" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#ff0080" letter-spacing="2">RQBBOX OS</text>
  </g>
  <!-- Central title -->
  <text x="640" y="240" text-anchor="middle" font-family="Segoe UI Variable,Segoe UI,system-ui,sans-serif" font-size="120" font-weight="800" letter-spacing="8" fill="url(#greenGrad)">RQBBOX</text>
  <text x="640" y="310" text-anchor="middle" font-family="Segoe UI Variable,Segoe UI,system-ui,sans-serif" font-size="56" font-weight="200" letter-spacing="24" fill="url(#cyanGrad)">LIFE</text>
  <!-- Tagline -->
  <text x="640" y="370" text-anchor="middle" font-family="Segoe UI Variable,Segoe UI,system-ui,sans-serif" font-size="18" fill="rgba(255,255,255,0.25)" letter-spacing="8">LIVE YOUR NEON LIFE</text>
  <!-- Feature grid right -->
  <g transform="translate(880,100)">
    <rect x="0" y="0" width="320" height="340" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <g transform="translate(160,40)">
      <text x="0" y="0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="3">FEATURES</text>
    </g>
    <g transform="translate(40,80)">
      <text font-family="Segoe UI,sans-serif" font-size="13" fill="#00d4ff">◈ Character Creator</text>
      <text y="28" font-family="Segoe UI,sans-serif" font-size="13" fill="#00ff88">◈ Career &amp; Jobs</text>
      <text y="56" font-family="Segoe UI,sans-serif" font-size="13" fill="#ff0080">◈ Housing &amp; Vehicles</text>
      <text y="84" font-family="Segoe UI,sans-serif" font-size="13" fill="#8844ff">◈ Social &amp; NPCs</text>
      <text y="112" font-family="Segoe UI,sans-serif" font-size="13" fill="#00d4ff">◈ Day/Night Cycle</text>
      <text y="140" font-family="Segoe UI,sans-serif" font-size="13" fill="#00ff88">◈ Dynamic Events</text>
      <text y="168" font-family="Segoe UI,sans-serif" font-size="13" fill="#ffdd00">◈ 15 Achievements</text>
      <text y="196" font-family="Segoe UI,sans-serif" font-size="13" fill="#ff0080">◈ Weather System</text>
      <text y="224" font-family="Segoe UI,sans-serif" font-size="13" fill="#00d4ff">◈ Controller Support</text>
      <text y="252" font-family="Segoe UI,sans-serif" font-size="13" fill="#00ff88">◈ Cloud Saves</text>
    </g>
    <rect x="40" y="290" width="240" height="30" rx="8" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="0.5"/>
    <text x="160" y="309" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#00d4ff" letter-spacing="3">RQBBOX OS · FLAGSHIP TITLE</text>
  </g>
  <!-- Version footer -->
  <text x="640" y="580" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="rgba(255,255,255,0.15)" letter-spacing="4">RQBBOX LIFE v1.0 &middot; 2026 &middot; RQBBOX OS</text>
</svg>
