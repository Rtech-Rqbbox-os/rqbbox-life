<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#080818"/>
      <stop offset="100%" stop-color="#0a0a2a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc6a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#8844ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g opacity="0.04" stroke="white" stroke-width="0.5">
    <line x1="0" y1="64" x2="512" y2="64"/><line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/><line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/><line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/><line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/><line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/><line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/><line x1="448" y1="0" x2="448" y2="512"/>
  </g>
  <circle cx="256" cy="180" r="100" fill="rgba(0,212,255,0.04)" filter="url(#glowStrong)"/>
  <g transform="translate(256,180)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="30" fill="rgba(0,212,255,0.06)"/>
    <path d="M-20,-15 L-20,15 L18,0 Z" fill="url(#greenGrad)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="-35" cy="-35" r="5" fill="#00d4ff" opacity="0.5"/>
    <circle cx="38" cy="-30" r="4" fill="#00ff88" opacity="0.4"/>
    <circle cx="-30" cy="38" r="4" fill="#ff0080" opacity="0.4"/>
    <circle cx="35" cy="35" r="3" fill="#8844ff" opacity="0.3"/>
    <circle cx="-10" cy="-50" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="50" cy="10" r="2" fill="#00ff88" opacity="0.5"/>
    <circle cx="-48" cy="-10" r="2" fill="#ff0080" opacity="0.4"/>
  </g>
  <text x="256" y="370" text-anchor="middle" font-family="Segoe UI Variable,Segoe UI,system-ui,sans-serif" font-size="76" font-weight="800" letter-spacing="6" fill="url(#greenGrad)">RQBBOX</text>
  <text x="256" y="420" text-anchor="middle" font-family="Segoe UI Variable,Segoe UI,system-ui,sans-serif" font-size="40" font-weight="200" letter-spacing="20" fill="url(#cyanGrad)">LIFE</text>
  <text x="256" y="460" text-anchor="middle" font-family="Segoe UI Variable,Segoe UI,system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.2)" letter-spacing="6">LIVE YOUR NEON LIFE</text>
  <rect x="180" y="472" width="152" height="24" rx="12" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <text x="256" y="489" text-anchor="middle" font-family="Segoe UI Variable,Segoe UI,system-ui,sans-serif" font-size="11" fill="#00d4ff">v1.0 &middot; RQBBOX OS</text>
</svg>
